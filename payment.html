<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Event Payment | Theatron</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h2 { color: #ff4b4b; margin-bottom: 10px; }
    p { color: #ccc; font-size: 15px; }
  </style>
</head>
<body>
  <h2>Processing Your Payment...</h2>
  <p>Please wait — do not refresh or close this page.</p>

  <script>
const params=new URLSearchParams(window.location.search);
const event=params.get("event")||"Theatron Event";
const name=params.get("name");
const email=params.get("email");
const phone=params.get("phone");
const college=params.get("college");
const amount=params.get("amount")||"0";
const currency=params.get("currency")||"INR";
const receipt=params.get("receipt")||`${event}_${Date.now()}`;
const redirect=params.get("redirect")||"https://theatron-nu.vercel.app";

async function startPayment(){
  try{
    console.log("➡️ Creating Razorpay order...");
    const res=await fetch("https://theatron-backend.onrender.com/payment/get_order",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({amount:Number(amount),currency,receipt})
    });
    const order=await res.json();
    console.log("✅ Order created:",order);

    const options={
      key:"rzp_live_RXQAxkawOc5Qfn",
      amount:order.amount,
      currency:order.currency,
      name:`Theatron - ${event}`,
      description:`Registration for ${event}`,
      order_id:order.id,
      prefill:{name,email,contact:phone},
      theme:{color:"#ff4b4b"},
      handler:async function(response){
        console.log("💳 Payment success:",response);
        try{
          document.querySelector("h2").innerText="Verifying payment...";
          const verifyRes=await fetch("https://theatron-backend.onrender.com/payment/verify_payment",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              payment_id:response.razorpay_payment_id,
              order_id:response.razorpay_order_id,
              signature:response.razorpay_signature,
              name:name,
              email:email,
              phone:phone,
              college:college,
              event:event,
              participant1:participant1,
              participant2:participant1,
            })
          });
          const verifyText=await verifyRes.text();
          console.log("🧾 Verify response:",verifyText);

          if(!verifyRes.ok) throw new Error("Verification failed");

          document.querySelector("h2").innerText="Registering you...";
          if( event ==='AdaptTune'){
            const Team_name = params.get('teamName');
            const participant1 = params.get('participant1');
            const college1 =params.get('college1');
            const participant2 = params.get('participant2');
            const college2 =params.get('college2');
            const phone = params.get('phone');
            const email = params.get('email');
            const ammount = params.get('amount');
            const regRes = await fetch(`https://theatron-backend.onrender.com/register/group/${event}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({Team_name,participant1,participant2,email,phone,college1,college2})
          });
          console.log("🗂 Registration response:",await regRes.text());
         }
          else if (event ==='Quizcorn'){
            const Team_name = params.get('teamName');
            const participant1 = params.get('participant1');
            const college1 =params.get('college1');
            const participant2 = params.get('participant2');
            const college2 =params.get('college2');
            const participant3 = params.get('participant3');
            const college3 =params.get('college3');
            const phone = params.get('phone');
            const email = params.get('email');
            const regRes = await fetch(`https://theatron-backend.onrender.com/register/group/${event}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({Team_name,participant1,participant2,participant3,email,phone,college1,college2,college3})
          });
          console.log("🗂 Registration response:",await regRes.text());
         }
          else {  
          const regRes=await fetch(`https://theatron-backend.onrender.com/register/solo/${event}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name,email,phone,college})
          });
          console.log("🗂 Registration response:",await regRes.text());
          }

          document.querySelector("h2").innerText="You will receive a confirmation email shortly.";
          const mailRes=await fetch("https://theatron-backend.onrender.com/mail/send_mail",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({to:email})
          });
          console.log("📧 Mail response:",await mailRes.text());

          // ✅ Finally redirect to success page
          const q=new URLSearchParams({
            status:"success",
            payment_id:response.razorpay_payment_id,
            order_id:response.razorpay_order_id,
            event,name,email,phone,college
          }).toString();
          console.log("🚀 Redirecting to:",`${redirect}?${q}`);
          window.location.href=`${redirect}?${q}`;
        }catch(err){
          console.error("❌ Error during verification/registration:",err);
          window.location.href=`${redirect}?status=failed&event=${event}`;
        }
      },
      modal:{
        ondismiss:function(){
          window.location.href=`${redirect}?status=cancelled&event=${event}`;
        }
      }
    };

    const rzp=new Razorpay(options);
    rzp.open();
  }catch(err){
    console.error("❌ Payment start error:",err);
    window.location.href=`${redirect}?status=failed&event=${event}`;
  }
}

startPayment();
</script>
</body>
</html>
